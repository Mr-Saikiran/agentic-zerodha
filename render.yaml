# Render Blueprint: Render dashboard → New → Blueprint → pick this repo.
# Visitors enter their own Kite and AI keys in the app, so no API keys are configured here.
# Free plan notes: the service sleeps after 15 minutes without traffic (first visit then takes ~1 min);
# saved keys and Kite logins survive that because they live in the visitor's encrypted cookie.
services:
  - type: web
    name: agentic-zerodha
    runtime: docker
    plan: free
    region: singapore
    dockerfilePath: ./Dockerfile
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: BASE_PATH
        value: /equity
      # The Redirect URL users set in their own Kite Connect app.
      - key: KITE_REDIRECT_URL
        value: https://techswitch.in/equity/callback
      # Encrypts session cookies. Generated once by Render; changing it signs everyone out.
      - key: SESSION_SECRET
        generateValue: true
