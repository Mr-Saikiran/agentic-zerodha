# Deploys to a Hugging Face Space on every push to main.
# Setup (GitHub repo → Settings → Secrets and variables → Actions):
#   secret   HF_TOKEN  = Hugging Face access token with write access
#   variable HF_SPACE  = <hf-username>/<space-name>, e.g. saikiran/agentic-zerodha
# Skipped when HF_SPACE isn't set, so forks don't fail.
name: Sync to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  sync:
    if: ${{ vars.HF_SPACE != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push to the Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_SPACE: ${{ vars.HF_SPACE }}
        run: |
          HF_USER="${HF_SPACE%%/*}"
          git push --force "https://${HF_USER}:${HF_TOKEN}@huggingface.co/spaces/${HF_SPACE}" HEAD:main
