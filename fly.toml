# fly.toml app configuration file generated for agentic-zerodha on 2026-10-29T16:03:33Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'agentic-zerodha'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  BASE_PATH = '/equity'
  DATA_DIR = '/data'
  KITE_REDIRECT_URL = 'https://techswitch.in/equity/callback'
  PORT = '8000'

[[mounts]]
  source = 'equity_data'
  destination = '/data'

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '30s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/healthz'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'
