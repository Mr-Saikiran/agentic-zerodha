name = "techswitch-equity"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-01"

# Only /equity and /equity/* go to the app. "/equity*" alone would also catch e.g. /equity-notes.
routes = [
  { pattern = "techswitch.in/equity", zone_name = "techswitch.in" },
  { pattern = "techswitch.in/equity/*", zone_name = "techswitch.in" },
]

# Twice-daily ping of /healthz. Harmless on an always-on VM; it keeps free hosts that sleep awake
# (Hugging Face Spaces: 48 h idle. On Render's free plan, which sleeps after 15 minutes, use "*/10 2-11 * * 1-5").
[triggers]
crons = ["0 */12 * * *"]

[vars]
# Public URL of the app. With the Oracle VM + Cloudflare Tunnel (docs/ORACLE_CLOUD.md) it's the tunnel's
# public hostname. Other hosts: https://agentic-zerodha.onrender.com, https://<hf-user>-agentic-zerodha.hf.space...
ORIGIN_URL = "https://equity-origin.techswitch.in"

# Optional origin lock: set the same value here and as ORIGIN_SECRET on the app with
#   npx wrangler secret put ORIGIN_SECRET
