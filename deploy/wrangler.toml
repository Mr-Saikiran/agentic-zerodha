name = "techswitch-equity"
main = "cloudflare-worker.js"
compatibility_date = "2026-10-01"

# Only /equity and /equity/* go to the app. "/equity*" alone would also catch e.g. /equity-notes.
routes = [
  { pattern = "techswitch.in/equity", zone_name = "techswitch.in" },
  { pattern = "techswitch.in/equity/*", zone_name = "techswitch.in" },
]

# Keep-awake ping: free Hugging Face Spaces sleep after 48 hours without traffic, so ping twice a day.
# (On Render's free plan, which sleeps after 15 minutes, use "*/10 2-11 * * 1-5" for market hours.)
# Remove it on a host that doesn't sleep.
[triggers]
crons = ["0 */12 * * *"]

[vars]
# Public URL of the app container. For a Hugging Face Space it's the direct URL:
# https://<hf-username>-<space-name>.hf.space (Space "..." menu -> "Embed this Space" shows it).
ORIGIN_URL = "https://YOUR-HF-USERNAME-agentic-zerodha.hf.space"

# Optional origin lock: set the same value here and as ORIGIN_SECRET on the app with
#   npx wrangler secret put ORIGIN_SECRET
